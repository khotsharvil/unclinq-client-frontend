  <path d="M295 165 Q302 148 296 138 Q288 136 280 148 Q276 157 278 162" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Top leaf — just emerged, small -->
  <path d="M255 175 Q248 152 250 130 Q256 124 262 144 Q260 160 255 175 Z" fill="#8F9779" stroke="#6B7860" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M255 175 Q255 150 256 130" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round"/>

  <!-- Motion lines arcing from top leaves — speed lines -->
  <!-- Arc 1 upper left -->
  <path d="M240 152 Q222 134 210 112" fill="none" stroke="#8F9779" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>
  <!-- Arc 2 upper far left -->
  <path d="M232 142 Q208 122 192 98" fill="none" stroke="#8F9779" stroke-width="1.2" stroke-linecap="round" opacity="0.32"/>
  <!-- Arc 3 top center-left -->
  <path d="M250 128 Q244 106 244 82" fill="none" stroke="#8F9779" stroke-width="1.5" stroke-linecap="round" opacity="0.40"/>
  <!-- Arc 4 upper right -->
  <path d="M268 148 Q288 128 302 104" fill="none" stroke="#8F9779" stroke-width="1.5" stroke-linecap="round" opacity="0.38"/>
</svg>
