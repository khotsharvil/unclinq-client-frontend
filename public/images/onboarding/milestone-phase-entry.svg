  <!-- Leaf lower right -->
  <path d="M258 333 Q288 312 304 280 Q292 272 268 296 Q261 314 258 333 Z" fill="#8F9779" stroke="#6B7860" stroke-width="1.5" stroke-linejoin="round"/>
