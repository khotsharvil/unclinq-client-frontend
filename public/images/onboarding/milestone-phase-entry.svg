  <ellipse cx="256" cy="379" rx="56" ry="8" fill="#3D4535"/>
  <ellipse cx="256" cy="381" rx="50" ry="5" fill="#2C332B"/>

  <!-- Main stem mid-surge -->
  <path d="M256 378 Q253 342 251 302 Q249 265 254 225 Q256 200 255 168" fill="none" stroke="#8F9779" stroke-width="2" stroke-linecap="round"/>

