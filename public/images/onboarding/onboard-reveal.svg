  <path d="M256 463 Q256 480 254 500" fill="none" stroke="#6B7860" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M268 462 Q274 478 278 498" fill="none" stroke="#6B7860" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M282 460 Q294 474 308 490" fill="none" stroke="#6B7860" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Secondary roots branching -->
  <path d="M204 490 Q196 498 188 506" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <path d="M308 490 Q318 498 328 504" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
