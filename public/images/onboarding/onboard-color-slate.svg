  <path d="M257 325 Q282 302 300 278" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round"/>

  <!-- Leaf 3 — mid left, slightly higher -->
  <path d="M255 285 Q225 265 212 234 Q225 226 248 250 Q254 268 255 285 Z" fill="#8F9779" stroke="#6B7860" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M255 285 Q228 258 212 234" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round"/>

  <!-- Leaf 4 — mid right -->
  <path d="M257 280 Q288 258 302 226 Q290 220 266 246 Q260 263 257 280 Z" fill="#8F9779" stroke="#6B7860" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M257 280 Q284 252 302 226" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round"/>

  <!-- Leaf 5 — upper left -->
  <path d="M255 240 Q228 218 218 186 Q232 180 252 208 Q255 224 255 240 Z" fill="#8F9779" stroke="#6B7860" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M255 240 Q234 212 218 186" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round"/>

  <!-- Leaf 6 — upper right -->
  <path d="M257 235 Q286 212 296 180 Q282 176 262 204 Q258 220 257 235 Z" fill="#8F9779" stroke="#6B7860" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M257 235 Q282 208 296 180" fill="none" stroke="#6B7860" stroke-width="1" stroke-linecap="round"/>

  <!-- Top leaf — centered, upright -->
  <path d="M256 168 Q246 140 248 112 Q256 106 264 130 Q262 149 256 168 Z" fill="#8F9779" stroke="#6B7860" stroke-width="1.5" stroke-linejoin="round"/>
