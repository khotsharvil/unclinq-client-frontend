<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#FDF9F4"/>

  <defs>
    <radialGradient id="glowSlate" cx="50%" cy="45%" r="38%">
      <stop offset="0%" stop-color="#4A7A8C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4A7A8C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cool teal glow behind plant -->
  <ellipse cx="256" cy="260" rx="160" ry="160" fill="url(#glowSlate)"/>

  <!-- Slate teal pot -->
