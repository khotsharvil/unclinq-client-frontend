  <rect x="198" y="368" width="116" height="13" rx="4" fill="#5A8A9C" stroke="#3A6070" stroke-width="1.5"/>
  <!-- Soil -->
  <ellipse cx="256" cy="372" rx="52" ry="7" fill="#3D4535"/>
  <ellipse cx="256" cy="374" rx="46" ry="5" fill="#2C332B"/>

  <!-- Main stem — very upright, measured -->
  <path d="M256 372 Q255 340 255 305 Q255 270 256 230 Q256 195 256 160" fill="none" stroke="#8F9779" stroke-width="2" stroke-linecap="round"/>

  <!-- Leaf 1 — lower left, symmetrical -->
