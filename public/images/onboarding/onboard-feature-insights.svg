  <!-- Line 4 -->
  <path d="M224 362 Q248 358 272 360 Q286 359 300 357" fill="none" stroke="#6B7860" stroke-width="1.5" stroke-linecap="round" opacity="0.30"/>
  <!-- Line 5 -->
  <path d="M236 387 Q252 383 268 384 Q278 384 290 382" fill="none" stroke="#6B7860" stroke-width="1.5" stroke-linecap="round" opacity="0.30"/>

