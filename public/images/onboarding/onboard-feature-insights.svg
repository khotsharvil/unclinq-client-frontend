  <path d="M256 300 C274 288 296 276 322 264" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 250 C274 238 296 224 320 210" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 200 C272 188 294 176 316 162" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 158 C268 146 280 134 292 122" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Abstract text lines etched on leaf surface — thin horizontal lines at 30% opacity -->
  <!-- Line 1 -->
  <path d="M210 290 Q240 286 270 288 Q290 288 306 285" fill="none" stroke="#6B7860" stroke-width="1.5" stroke-linecap="round" opacity="0.30"/>
  <!-- Line 2 -->
