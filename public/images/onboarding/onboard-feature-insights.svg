  <path d="M256 250 C238 238 216 224 192 210" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 200 C240 188 218 176 196 162" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 158 C244 146 232 134 220 122" fill="none" stroke="#6B7860" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

